name: Release

# Every push to main builds the package exactly as it would be published and checks it (the
# dry-run). A pushed tag v<version> runs the same dry-run, then, after a person approves the
# "release" environment, publishes those very files to Maven Central and creates the GitHub
# release.
#
# What the repository owner sets up once (nothing here creates it):
#
# - Environment "release" (Settings, Environments): required reviewers, the people who approve
#   each release; deployment branches and tags limited to the tag rule "v*". It holds the four
#   secrets below and nothing else uses them.
# - Secrets of the environment "release":
#   - MAVEN_CENTRAL_USERNAME and MAVEN_CENTRAL_PASSWORD: the two halves of a Central Portal user
#     token, generated at https://central.sonatype.com/usertoken by an account that owns the
#     verified namespace com.bynn (Add Namespace "com.bynn", verified by a DNS TXT record on
#     bynn.com holding the namespace's verification key).
#   - MAVEN_GPG_PRIVATE_KEY: the ASCII-armoured private key that signs every file
#     (gpg --armor --export-secret-keys <key id>). The primary key signs, so the key has no
#     separate signing subkey; its public key is sent to keyserver.ubuntu.com
#     (gpg --keyserver keyserver.ubuntu.com --send-keys <key id>) before the first release.
#   - MAVEN_GPG_PASSPHRASE: that key's passphrase.
# - No repository variable. Maven Central takes no OpenID Connect token, so there is no trusted
#   publisher to register.
#
# Publishing goes through the Central Portal's Publisher API (POST /api/v1/publisher/upload),
# with no Gradle plugin: Gradle's own maven-publish writes the files in the dry-run, and the
# publish job only signs, adds checksums, zips and uploads them. The upload uses publishingType
# AUTOMATIC: the environment's reviewers are the release gate, so a deployment that passes
# Central's validation goes out without a second approval in the Portal.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

# Every action is pinned to a commit SHA; the tag it was resolved from follows as a comment.
jobs:
  dry-run:
    name: Build and check the package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # The jar, the sources and javadoc jars, the POM and Gradle's module metadata, written in
      # the Maven repository layout. Gradle's own checksums and maven-metadata.xml are dropped:
      # the publish job adds the checksums Central asks for, and Central builds its own metadata.
      - name: Build the publication
        run: |
          ./gradlew build publishMavenPublicationToStagingRepository --no-daemon
          dir=build/staging-deploy
          find "$dir" -type f \( -name '*.md5' -o -name '*.sha1' -o -name '*.sha256' -o -name '*.sha512' -o -name 'maven-metadata.xml' \) -delete
          find "$dir" -type f | sort

      - name: Check the coordinates and the metadata
        shell: bash
        run: |
          set -euo pipefail
          expected="$(grep -m1 -oE '^## \[[^]]+\]' CHANGELOG.md | sed -E 's/^## \[(.*)\]$/\1/')"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            expected="${GITHUB_REF_NAME#v}"
          fi
          version="$(sed -n 's/^version=//p' gradle.properties)"
          if [[ "$version" != "$expected" ]]; then
            echo "::error::version $version is not $expected (the tag, or the CHANGELOG's top entry on main)"
            exit 1
          fi
          dir="build/staging-deploy/com/bynn/decisionnode/$version"
          pom="$dir/decisionnode-$version.pom"
          test -f "$pom" || { echo "::error::no POM at $pom"; exit 1; }
          field() { python3 -c 'import sys, xml.etree.ElementTree as E; n={"m": "http://maven.apache.org/POM/4.0.0"}; e=E.parse(sys.argv[1]).getroot().find(sys.argv[2], n); print("" if e is None or e.text is None else e.text.strip())' "$pom" "$1"; }
          check() {
            local got; got="$(field "$1")"
            if [[ "$got" != "$2" ]]; then echo "::error::POM $1 is '$got', expected '$2'"; exit 1; fi
          }
          check m:groupId com.bynn
          check m:artifactId decisionnode
          check m:version "$version"
          check m:name DecisionNode
          check m:licenses/m:license/m:name "MIT License"
          check m:scm/m:url "https://github.com/${GITHUB_REPOSITORY}"
          check m:url "https://github.com/${GITHUB_REPOSITORY}"
          for f in m:description m:developers/m:developer/m:name m:scm/m:connection m:scm/m:developerConnection m:licenses/m:license/m:url; do
            [[ -n "$(field "$f")" ]] || { echo "::error::POM $f is empty"; exit 1; }
          done
          grep -q 'MIT License' LICENSE || { echo "::error::LICENSE is not the MIT License"; exit 1; }
          [[ -s README.md ]] || { echo "::error::README.md is missing"; exit 1; }
          echo "com.bynn:decisionnode:$version, MIT, $(field m:scm/m:url)"

      - name: Check the contents against the allowlist
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' gradle.properties)"
          root=build/staging-deploy
          base="com/bynn/decisionnode/$version/decisionnode-$version"
          expected="$(printf '%s\n' "$base-javadoc.jar" "$base-sources.jar" "$base.jar" "$base.module" "$base.pom" | sort)"
          actual="$(cd "$root" && find . -type f | sed 's#^\./##' | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::the publication's files are not the allowlist"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          entries() { unzip -Z1 "$root/$1"; }
          only() {
            local jar="$1" pattern="$2" bad
            bad="$(entries "$jar" | grep -vE "$pattern" || true)"
            if [[ -n "$bad" ]]; then
              echo "::error::$jar holds files outside its allowlist:"
              echo "$bad"
              exit 1
            fi
          }
          dirs='META-INF/|com/|com/bynn/|com/bynn/decisionnode/'
          only "$base.jar" "^($dirs|META-INF/MANIFEST\.MF|com/bynn/decisionnode/[A-Za-z0-9\$]+\.class)\$"
          only "$base-sources.jar" "^($dirs|META-INF/MANIFEST\.MF|com/bynn/decisionnode/[A-Za-z0-9]+\.java)\$"
          only "$base-javadoc.jar" "^($dirs|META-INF/MANIFEST\.MF|com/bynn/decisionnode/[A-Za-z0-9.-]+\.html|[a-z.-]+\.(html|js|css)|element-list|legal/([A-Za-z_]+(\.md)?)?|resources/([a-z-]+\.(png|svg|gif))?|script-dir/([a-z0-9.-]+\.(js|css))?)\$"
          for jar in "$base.jar" "$base-sources.jar" "$base-javadoc.jar"; do
            echo "$jar: $(entries "$jar" | wc -l) entries"
          done

      - name: Check for names that never go in a published package
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' gradle.properties)"
          root="build/staging-deploy/com/bynn/decisionnode/$version"
          work="$(mktemp -d)"
          for jar in "$root"/*.jar; do
            mkdir -p "$work/$(basename "$jar")"
            unzip -q "$jar" -d "$work/$(basename "$jar")"
          done
          cp "$root"/*.pom "$root"/*.module "$work/"
          # The words no published file may hold (internal names, internal
          # paths, attribution lines), kept encoded so this public file does not
          # spell them out.
          pattern="$(printf '%s' 'ZG9jcy9bMC05XXsyfXxiYWNrZW5kL1swLTldezJ9fHByb2R1Y3RzL3wvVXNlcnMvfGNvLWF1dGhvcmVkLWJ5fGdlbmVyYXRlZCB3aXRo' | base64 -d)"
          if grep -rnaiE "$pattern" "$work"; then
            echo "::error::the package holds a name that never goes in a published package"
            exit 1
          fi
          # The boosters the API does not serve yet are not described to users.
          if grep -niE 'face_detection|wanted_person' README.md "$root"/*.pom; then
            echo "::error::the README or the description names a booster that is not served"
            exit 1
          fi
          echo "clean"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maven-publication
          path: build/staging-deploy/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to Maven Central
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dry-run
    runs-on: ubuntu-latest
    # Required reviewers approve each release; the environment holds the four secrets.
    environment: release
    permissions:
      # The GitHub release. Maven Central takes no OpenID Connect token, so no id-token.
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only a commit already on main is released: a tag pushed on any other branch, or on a
      # commit that never went through review, stops here.
      - name: Check that the tag is on main
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          tagged="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$tagged" refs/remotes/origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at $tagged, which is not on main"
            exit 1
          fi
          echo "${GITHUB_REF_NAME} ($tagged) is on main"

      # The dry-run's own files: nothing is built again.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: maven-publication
          path: publication

      - name: Sign the files and add their checksums
        shell: bash
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
          version="${GITHUB_REF_NAME#v}"
          dir="publication/com/bynn/decisionnode/$version"
          test -d "$dir" || { echo "::error::the artifact holds no $dir"; exit 1; }
          for f in "$dir"/*; do
            printf '%s' "$MAVEN_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --armor --detach-sign --output "$f.asc" "$f"
            gpg --batch --verify "$f.asc" "$f"
            md5sum "$f" | cut -d' ' -f1 > "$f.md5"
            sha1sum "$f" | cut -d' ' -f1 > "$f.sha1"
          done
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"
          (cd publication && zip -qr ../bundle.zip com)
          unzip -l bundle.zip

      - name: Upload to the Central Portal and wait for Maven Central
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          auth="Authorization: Bearer $(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)"
          api=https://central.sonatype.com/api/v1/publisher
          id="$(curl -sS --fail-with-body -X POST -H "$auth" \
            -F "bundle=@bundle.zip;type=application/octet-stream" \
            "$api/upload?name=decisionnode-${GITHUB_REF_NAME}&publishingType=AUTOMATIC")"
          echo "deployment $id"
          for _ in $(seq 1 180); do
            status="$(curl -sS --fail-with-body -X POST -H "$auth" "$api/status?id=$id")"
            state="$(printf '%s' "$status" | python3 -c 'import json, sys; print(json.load(sys.stdin)["deploymentState"])')"
            echo "$state"
            case "$state" in
              PUBLISHED) exit 0 ;;
              FAILED) echo "::error::Central refused the deployment: $status"; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::deployment $id was not published within an hour; see the Central Portal"
          exit 1

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # The notes are this version's CHANGELOG section, without its heading.
          awk -v v="$version" '
            $0 ~ "^## \\[" { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [[ -s notes.md ]] || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes.md \
            publication/com/bynn/decisionnode/"$version"/decisionnode-"$version".jar
