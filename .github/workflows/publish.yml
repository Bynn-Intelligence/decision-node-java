# Runs only while the repository is public (nothing is bumped, tagged or published while it is private), and checks the files to publish for internal names before anything is pushed or published.
#
# Auto-release com.bynn:decisionnode on every push to main: bump the patch in
# gradle.properties, run the tests, deploy to Maven Central through the
# Central Portal, push the bump commit and tag back to main, and cut the
# GitHub release. The push back uses the default GITHUB_TOKEN, which does not
# retrigger this workflow, and the bump commit carries [skip publish] as a
# second guard.
#
# To ship without cutting a release (docs, CI tweaks), put [skip publish] in
# the commit message.
#
# The build is Gradle's: maven-publish writes the publication into
# build/staging-deploy, and the deploy step signs it, adds the checksums and
# uploads the bundle through the Central Portal Publisher API with
# publishingType AUTOMATIC. The tests here are the unit tests; the
# conformance suite runs in ci.yml.
#
# Needs four secrets, all from the one-time Maven Central setup:
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD  the Central Portal token
#     pair (central.sonatype.com -> Account -> Generate User Token), valid for
#     the verified com.bynn namespace.
#   GPG_PRIVATE_KEY  an armored private key (gpg --armor --export-secret-keys)
#     whose public half is on keyserver.ubuntu.com; Central verifies the
#     signatures against it.
#   GPG_PASSPHRASE   its passphrase.
name: Publish to Maven Central

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions: read-all

jobs:
  publish:
    if: "github.event.repository.visibility == 'public' && !contains(github.event.head_commit.message, '[skip publish]')"
    runs-on: ubuntu-latest
    environment: maven-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CURRENT=$(sed -n 's/^version=//p' gradle.properties)
          NEW="${CURRENT%.*}.$(( ${CURRENT##*.} + 1 ))"
          sed -i "s/^version=${CURRENT}$/version=${NEW}/" gradle.properties
          # The client's VERSION constant (its User-Agent) moves with it; the
          # build's versionMatchesTheBuild test fails if the two differ.
          sed -i "s/VERSION = \"${CURRENT}\";/VERSION = \"${NEW}\";/" src/main/java/com/bynn/decisionnode/DecisionNode.java
          grep -q "VERSION = \"${NEW}\";" src/main/java/com/bynn/decisionnode/DecisionNode.java
          echo "version=${NEW}" >> "$GITHUB_OUTPUT"

      - run: ./gradlew build --no-daemon
      - run: ./gradlew publishMavenPublicationToStagingRepository --no-daemon
      - name: Check the files to publish for internal names
        shell: bash
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          DN_NAME_CHECK_WORDS: ${{ secrets.DN_NAME_CHECK_WORDS }}
        run: |
          set -- build/staging-deploy/com/bynn/decisionnode/"$VERSION"/*.jar build/staging-deploy/com/bynn/decisionnode/"$VERSION"/*.pom build/staging-deploy/com/bynn/decisionnode/"$VERSION"/*.module
          python3 .github/scripts/check_names.py --commits "$@" README.md

      - run: |
          git add gradle.properties src/main/java/com/bynn/decisionnode/DecisionNode.java
          git commit -m "Release v${{ steps.bump.outputs.version }} [skip publish]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main "v${{ steps.bump.outputs.version }}"

      - run: |
          set -euo pipefail
          dir="com/bynn/decisionnode/${VERSION}"
          # Gradle wrote the jars, the POM and the module with their checksums;
          # each of those four files gets its signature.
          for f in build/staging-deploy/"$dir"/*.jar build/staging-deploy/"$dir"/*.pom build/staging-deploy/"$dir"/*.module; do
            printf '%s' "$MAVEN_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --armor --detach-sign --output "$f.asc" "$f"
          done
          (cd build/staging-deploy && zip -qr ../central-bundle.zip "$dir")
          auth="Authorization: Bearer $(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)"
          api=https://central.sonatype.com/api/v1/publisher
          id=$(curl -sS --fail-with-body -X POST -H "$auth" \
            -F "bundle=@build/central-bundle.zip;type=application/octet-stream" \
            "$api/upload?name=decisionnode-${VERSION}&publishingType=AUTOMATIC")
          for _ in $(seq 1 180); do
            state=$(curl -sS --fail-with-body -X POST -H "$auth" "$api/status?id=${id}" | jq -r .deploymentState)
            echo "deployment ${id}: ${state}"
            case "$state" in
              PUBLISHED) exit 0 ;;
              FAILED) exit 1 ;;
            esac
            sleep 20
          done
          exit 1
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - run: gh release create "v${{ steps.bump.outputs.version }}" --title "v${{ steps.bump.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
