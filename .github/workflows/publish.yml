# Runs only while the repository is public (nothing is bumped, tagged or published while it is private), and checks the files to publish for internal names before anything is pushed or published.
#
# Auto-release com.bynn:decisionnode on every push to main: bump the patch in
# gradle.properties, run the tests, deploy to Maven Central through the
# Central Portal, push the bump commit and tag back to main, and cut the
# GitHub release. The push back uses the default GITHUB_TOKEN, which does not
# retrigger this workflow, and the bump commit carries [skip publish] as a
# second guard.
#
# To ship without cutting a release (docs, CI tweaks), put [skip publish] in
# the commit message.
#
# The build is Gradle's: maven-publish writes the publication into
# build/staging-deploy, and the deploy step signs it, adds the checksums and
# uploads the bundle through the Central Portal Publisher API with
# publishingType AUTOMATIC. The tests here are the unit tests; the
# conformance suite runs in ci.yml.
#
# Needs four secrets, all from the one-time Maven Central setup:
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD  the Central Portal token
#     pair (central.sonatype.com -> Account -> Generate User Token), valid for
#     the verified com.bynn namespace.
#   GPG_PRIVATE_KEY  an armored private key (gpg --armor --export-secret-keys)
#     whose public half is on keyserver.ubuntu.com; Central verifies the
#     signatures against it.
#   GPG_PASSPHRASE   its passphrase.
name: Publish to Maven Central

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions: read-all

jobs:
  publish:
    if: "github.event.repository.visibility == 'public' && !contains(github.event.head_commit.message, '[skip publish]')"
    runs-on: ubuntu-latest
    environment: maven-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CURRENT=$(sed -n 's/^version=//p' gradle.properties)
          NEW="${CURRENT%.*}.$(( ${CURRENT##*.} + 1 ))"
          sed -i "s/^version=${CURRENT}$/version=${NEW}/" gradle.properties
          echo "version=${NEW}" >> "$GITHUB_OUTPUT"

      - run: ./gradlew build --no-daemon
      - run: ./gradlew publishMavenPublicationToStagingRepository --no-daemon
      - name: Check the files to publish for internal names
        shell: bash
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -- build/staging-deploy/com/bynn/decisionnode/"$VERSION"/*.jar build/staging-deploy/com/bynn/decisionnode/"$VERSION"/*.pom build/staging-deploy/com/bynn/decisionnode/"$VERSION"/*.module
          if grep -nE '\b(face_detection|face_recognition|wanted_person)\b' README.md; then
            echo "::error::README.md names a booster the README does not list"
            exit 1
          fi
          python3 - "$@" <<'PY'
          # Fails when a file to publish holds an internal name, an internal
          # path or an attribution line. The names are kept only as SHA-256
          # digests of each lowercase word, so this file does not spell them.
          import base64, binascii, hashlib, io, re, sys, tarfile, zipfile
          DIGESTS = {
              "9e9b2efac0b62e4cf6f08cc6b7095e6ad7e18c447458c5849accb698f7149ef3",
              "934a11e602682e862b4b4d1f881ae8da1e097e3f6964bd780e5bb1fb798a6fdd",
              "b7933ed6180d9e2895a9d2df885e2a8b92e998a3c16297581f5b8698daacf492",
              "31d1b3d540ecf85228db7797efbe7d198ec5406abd3f6e64f27f684e9a312d29",
              "2e0b8d61fa2a6959d254b6ff5d0fb512249329097336a35568089933b49abdde",
          }
          PLAIN = re.compile(rb"docs/[0-9]{2}|backend/[0-9]{2}|products/|/users/|co-authored-by|generated with")
          WORD = re.compile(rb"[a-z0-9]+")
          B64 = re.compile(rb"[A-Za-z0-9+/]{8,}={0,2}")

          def named(text):
              return any(hashlib.sha256(w).hexdigest() in DIGESTS for w in set(WORD.findall(text.lower())))

          def faults(data):
              # Bytes as they are, and as UTF-16 for the strings of a .NET assembly.
              views = [data, data.decode("utf-16-le", "ignore").encode("utf-8", "ignore")]
              found = set()
              for view in views:
                  if named(view):
                      found.add("an internal name")
                  for token in B64.findall(view):
                      try:
                          decoded = base64.b64decode(token + b"=" * (-len(token) % 4), validate=True)
                      except (binascii.Error, ValueError):
                          continue
                      if named(decoded):
                          found.add("an internal name in base64")
                  match = PLAIN.search(view.lower())
                  if match:
                      found.add(match.group(0).decode("ascii", "replace"))
              return found

          def members(path, data):
              if zipfile.is_zipfile(io.BytesIO(data)):
                  with zipfile.ZipFile(io.BytesIO(data)) as archive:
                      for name in archive.namelist():
                          yield from members(f"{path}!{name}", archive.read(name))
              elif path.endswith((".crate", ".tar.gz", ".tgz")):
                  with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as archive:
                      for member in archive.getmembers():
                          if member.isfile():
                              yield from members(f"{path}!{member.name}", archive.extractfile(member).read())
              else:
                  yield path, data

          bad = 0
          checked = 0
          for path in sys.argv[1:]:
              with open(path, "rb") as handle:
                  for name, data in members(path, handle.read()):
                      checked += 1
                      for fault in sorted(faults(data)):
                          print(f"::error::{name} holds {fault}")
                          bad += 1
          print(f"{checked} files checked")
          sys.exit(1 if bad or not checked else 0)
          PY


      - run: |
          git add gradle.properties
          git commit -m "Release v${{ steps.bump.outputs.version }} [skip publish]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main "v${{ steps.bump.outputs.version }}"

      - run: |
          set -euo pipefail
          dir="com/bynn/decisionnode/${VERSION}"
          # Gradle wrote the jars, the POM and the module with their checksums;
          # each of those four files gets its signature.
          for f in build/staging-deploy/"$dir"/*.jar build/staging-deploy/"$dir"/*.pom build/staging-deploy/"$dir"/*.module; do
            printf '%s' "$MAVEN_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --armor --detach-sign --output "$f.asc" "$f"
          done
          (cd build/staging-deploy && zip -qr ../central-bundle.zip "$dir")
          auth="Authorization: Bearer $(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)"
          api=https://central.sonatype.com/api/v1/publisher
          id=$(curl -sS --fail-with-body -X POST -H "$auth" \
            -F "bundle=@build/central-bundle.zip;type=application/octet-stream" \
            "$api/upload?name=decisionnode-${VERSION}&publishingType=AUTOMATIC")
          for _ in $(seq 1 180); do
            state=$(curl -sS --fail-with-body -X POST -H "$auth" "$api/status?id=${id}" | jq -r .deploymentState)
            echo "deployment ${id}: ${state}"
            case "$state" in
              PUBLISHED) exit 0 ;;
              FAILED) exit 1 ;;
            esac
            sleep 20
          done
          exit 1
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - run: gh release create "v${{ steps.bump.outputs.version }}" --title "v${{ steps.bump.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
