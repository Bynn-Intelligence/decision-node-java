name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The conformance suite commit this SDK is tested against (suite 1.11, for specification 1.3). Change it here only.
  CONFORMANCE_REF: 49c92b052242a99a858040f66b05c1dca087e339

# Every action is pinned to a commit SHA; the tag it was resolved from follows as a comment.
jobs:
  test:
    name: Unit tests (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          # JDK 17 is the build toolchain; the last one listed runs Gradle.
          java-version: |
            17
            ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Build and test
        run: ./gradlew build --no-daemon

  conformance:
    name: Conformance suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Check out the conformance suite
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: Bynn-Intelligence/decision-node-conformance
          ref: ${{ env.CONFORMANCE_REF }}
          token: ${{ secrets.DECISIONNODE_CONFORMANCE_TOKEN }}
          persist-credentials: false
          path: conformance

      - name: Python for the mock server
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # The Gradle task starts the suite's mock server and runs every case of every kind.
      - name: Run the conformance suite
        env:
          DECISIONNODE_CONFORMANCE_DIR: ${{ github.workspace }}/conformance
        run: ./gradlew conformance --no-daemon
